name: Snapshot Integrity

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements_ci.txt
      # Only the frozen-snapshot check. The Streamlit app under src/app is
      # kept as part of the exhibit but is no longer built, tested or
      # deployed by CI.
      - run: pytest tests/test_snapshot_integrity.py
